apiVersion: v1
kind: ServiceAccount
metadata: {name: ops-agent, namespace: capstone}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata: {name: ops-agent-readonly, namespace: capstone}
rules:
  - apiGroups: [""]
    resources: ["pods", "pods/log", "events"]
    verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata: {name: ops-agent-readonly, namespace: capstone}
subjects:
  - {kind: ServiceAccount, name: ops-agent, namespace: capstone}
roleRef: {kind: Role, name: ops-agent-readonly, apiGroup: rbac.authorization.k8s.io}
