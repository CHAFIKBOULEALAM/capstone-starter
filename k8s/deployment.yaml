apiVersion: apps/v1
kind: Deployment
metadata:
  name: capstone-api
spec:
  replicas: 2
  selector:
    matchLabels: {app: capstone-api}
  template:
    metadata:
      labels: {app: capstone-api}
    spec:
      containers:
        - name: api
          image: capstone-api:0.1
          ports: [{containerPort: 8000}]
