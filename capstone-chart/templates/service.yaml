apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}-capstone-api
  labels:
    app: capstone-api
    release: {{ .Release.Name }}
spec:
  type: {{ .Values.service.type }}
  selector:
    app: capstone-api
    release: {{ .Release.Name }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
